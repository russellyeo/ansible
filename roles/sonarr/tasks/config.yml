# Sonarr owns config.xml and rewrites it when settings change in the UI, so
# only the settings in sonarr_config_settings are managed here. Sonarr creates the
# file on first start; the next run sets these.
---
- name: Check for Sonarr config
  tags:
    - sonarr
    - config
  stat:
    path: "{{ config_directory }}/sonarr/config.xml"
  register: sonarr_config

- name: Set config.xml settings
  tags:
    - sonarr
    - config
  replace:
    path: "{{ config_directory }}/sonarr/config.xml"
    regexp: '<{{ item.key }}>.*</{{ item.key }}>'
    replace: '<{{ item.key }}>{{ item.value }}</{{ item.key }}>'
  loop: "{{ sonarr_config_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: sonarr_config.stat.exists
  notify: Restart sonarr
