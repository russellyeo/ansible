---
host_port: '8989'

# Sonarr answers only to these Host headers (<AllowedHosts> in config.xml).
# `sonarr` is the container name on the docker network.
sonarr_allowed_hosts:
  - sonarr
  - "{{ network_localhost }}"
  - "sonarr.{{ home_domain }}"
  - "sonarr.{{ public_domain }}"

# Settings written into config.xml (tasks/config.yml). Only these keys are
# touched; Sonarr owns the rest of the file.
# AuthenticationMethod External: no login. Only the LAN and the tailnet can
# reach Traefik, and DisabledForLocalAddresses doesn't work behind it (any
# request with X-Forwarded-For counts as non-local).
sonarr_config_settings:
  AllowedHosts: "{{ sonarr_allowed_hosts | join(',') }}"
  AuthenticationMethod: External
  UrlBase: ""
