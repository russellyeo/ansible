---
- name: Ensure config directory is present
  tags:
    - traefik
    - config
  file:
    path: "{{ config_directory }}/traefik"
    state: directory
    owner: servarr
    group: servarr
    mode: "{{ directory_mode }}"

- name: Ensure dynamic config directory is present
  tags:
    - traefik
    - config
  file:
    path: "{{ config_directory }}/traefik/dynamic"
    state: directory
    owner: servarr
    group: servarr
    mode: "{{ directory_mode }}"

# Writable, unlike the config mount. Traefik creates acme.json here (0600).
- name: Ensure ACME directory is present
  tags:
    - traefik
    - config
  file:
    path: "{{ config_directory }}/traefik/acme"
    state: directory
    owner: servarr
    group: servarr
    mode: "700"

- name: Template config files
  tags:
    - traefik
    - config
  template:
    src: "{{ item }}.j2"
    dest: "{{ config_directory }}/traefik/{{ item }}"
    owner: servarr
    group: servarr
    mode: "600"
  loop:
    - "traefik.toml"
    - "dynamic/plex.toml"
    - "dynamic/https.toml"
