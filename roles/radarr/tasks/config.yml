# Radarr owns config.xml and rewrites it when settings change in the UI, so
# only the settings in radarr_config_settings are managed here. Radarr creates the
# file on first start; the next run sets these.
---
- name: Check for Radarr config
  tags:
    - radarr
    - config
  stat:
    path: "{{ config_directory }}/radarr/config.xml"
  register: radarr_config

- name: Set config.xml settings
  tags:
    - radarr
    - config
  replace:
    path: "{{ config_directory }}/radarr/config.xml"
    regexp: '<{{ item.key }}>.*</{{ item.key }}>'
    replace: '<{{ item.key }}>{{ item.value }}</{{ item.key }}>'
  loop: "{{ radarr_config_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: radarr_config.stat.exists
  notify: Restart radarr
