# Plex Media Server
# https://docs.linuxserver.io/images/docker-plex
---
- name: Start container
  tags:
    - container
    - plex
    - media
  docker_container:
    name: plex
    image: lscr.io/linuxserver/plex:latest
    state: "{{ docker_state }}"
    restart: "{{ docker_restart }}"
    restart_policy: "{{ docker_restart_policy }}"
    recreate: "{{ docker_recreate }}"
    network_mode: host
    volumes:
      - "{{ config_directory }}/plex:/config"
      - "{{ data_directory }}/media:/media"
    dns_servers:
      - "{{ dns_primary }}"
      - "{{ dns_secondary }}"
    env:
      PUID: "{{ servarr_uid }}"
      PGID: "{{ servarr_gid }}"
      VERSION: "docker"
      PLEX_CLAIM: "{{ plex_claim }}"
    labels:
      # Routed by Traefik's file provider, not here: network_mode host leaves
      # the docker provider with no backend IP and it falls back to 127.0.0.1.
      # See roles/traefik/templates/dynamic/plex.toml.j2
      traefik.enable: "false"
      homepage.group: "Media"
      homepage.name: "Plex"
      homepage.icon: "plex.png"
      homepage.description: "Watch stuff"
      homepage.href: "http://plex.{{ home_domain }}"
      homepage.weight: "1"
      homepage.widget.type: plex
      homepage.widget.url: "http://{{ docker_bridge_gateway }}:{{ host_port }}"
      homepage.widget.key: "{{ plex_api_key }}"
