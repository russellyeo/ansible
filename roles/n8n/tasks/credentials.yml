# TMDB and OMDb API keys for the cinema workflows, from the vault. The
# rendered file stays on the NAS (0600) so an unchanged render skips the
# re-import.
---
- name: Render cinema API credentials
  tags:
    - n8n
    - credentials
  template:
    src: credentials.json.j2
    dest: '{{ config_directory }}/n8n/cinema-credentials.json'
    variable_start_string: '<<'
    variable_end_string: '>>'
    owner: servarr
    group: servarr
    mode: '0600'
  no_log: true
  register: n8n_cinema_credentials

- name: Import cinema API credentials
  tags:
    - n8n
    - credentials
  community.docker.docker_container_exec:
    container: n8n
    argv:
      - n8n
      - import:credentials
      - --input=/home/node/.n8n/cinema-credentials.json
  register: n8n_cli
  until: n8n_cli.rc == 0
  retries: 3
  delay: 10
  when: n8n_cinema_credentials.changed
  notify: Restart n8n
