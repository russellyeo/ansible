---
- name: Ensure config directory is present
  tags:
    - n8n
    - file
    - config
  file:
    path: '{{ config_directory }}/n8n'
    state: directory
    owner: servarr
    group: servarr
    mode: '{{ directory_mode }}'

- name: Ensure cache directory is present
  tags:
    - n8n
    - file
    - config
  file:
    path: '{{ config_directory }}/n8n-cache'
    state: directory
    owner: servarr
    group: servarr
    mode: '{{ directory_mode }}'

- name: Ensure Tailscale directories are present
  tags:
    - n8n
    - file
    - config
  file:
    path: '{{ config_directory }}/n8n-tailscale/{{ item }}'
    state: directory
    owner: servarr
    group: servarr
    mode: '{{ directory_mode }}'
  loop:
    - ''
    - state

- name: Create Tailscale serve config
  tags:
    - n8n
    - config
  copy:
    src: tailscale-serve.json
    dest: '{{ config_directory }}/n8n-tailscale/serve.json'
    owner: servarr
    group: servarr
    mode: '{{ file_mode }}'

- name: Ensure Health raw payload directories are present
  tags:
    - n8n
    - file
    - config
  file:
    path: '{{ health_raw_directory }}/{{ item }}'
    state: directory
    owner: servarr
    group: servarr
    mode: '{{ directory_mode }}'
  loop:
    - ''
    - capture
    - workouts
    - metrics

# Seeds for the ingest and staleness workflows; never overwritten, since
# n8n keeps them up to date.
- name: Ensure health ledger and last-payload marker exist
  tags:
    - n8n
    - file
    - config
  copy:
    dest: '{{ health_raw_directory }}/{{ item.name }}'
    content: '{{ item.content }}'
    force: false
    owner: servarr
    group: servarr
    mode: '{{ file_mode }}'
  loop:
    - { name: ledger.json, content: '{"workouts": {}}' }
    - { name: last-payload.json, content: '{{ {"received": now(utc=true).isoformat() ~ "Z", "kind": "none"} | to_json }}' }
  loop_control:
    label: '{{ item.name }}'
