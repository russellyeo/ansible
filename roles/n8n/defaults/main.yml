---
host_port: '5678'

# Reached over the tailnet with a real HTTPS cert; Google OAuth needs this
# for its callback (it rejects http://n8n.home.arpa).
n8n_tailnet_url: "https://n8n.{{ tailnet_host }}"

# Inline photos for the reminder email, base64-encoded on the controller.
ccfm_photos:
  park: '{{ lookup(''ansible.builtin.pipe'', ''base64 < '' ~ role_path ~ ''/files/ccfm/photos/park.jpg | tr -d "\n"'') }}'
  campsbourne: '{{ lookup(''ansible.builtin.pipe'', ''base64 < '' ~ role_path ~ ''/files/ccfm/photos/campsbourne.jpg | tr -d "\n"'') }}'

# Overridable to force a fetch failure when testing the error workflow.
ccfm_page_url: "https://www.weareccfm.com/our-markets/alexandra-palace/"

# Cinemas for the subtitled screenings workflows (files/cinema). A new branch
# of a supported chain (picturehouse, everyman, bfi) is one entry; chain_id
# is the chain's own cinema ID. BFI's kind is `captioned`, or `by-language`
# to send its foreign-language films to the digest's subtitled section.
cinemas:
  - key: ph-crouch-end
    name: Picturehouse Crouch End
    chain: picturehouse
    chain_id: "024"
    address: 165 Tottenham Lane, London N8 9BY
    map_url: https://www.google.com/maps/search/?api=1&query=Crouch%20End%20Picturehouse%2C%20165%20Tottenham%20Lane%2C%20London%20N8%209BY
  - key: ph-finsbury-park
    name: Picturehouse Finsbury Park
    chain: picturehouse
    chain_id: "029"
    address: 17 City North Place, London N4 3FU
    map_url: https://www.google.com/maps/search/?api=1&query=Finsbury%20Park%20Picturehouse%2C%2017%20City%20North%20Place%2C%20London%20N4%203FU
  - key: everyman-muswell-hill
    name: Everyman Muswell Hill
    chain: everyman
    chain_id: X06SN
    address: Fortis Green Road, London N10 3HP
    map_url: https://www.google.com/maps/search/?api=1&query=Everyman%20Muswell%20Hill%2C%20Fortis%20Green%20Road%2C%20London%20N10%203HP
  - key: bfi-imax
    name: BFI IMAX
    chain: bfi
    kind: captioned
    address: 1 Charlie Chaplin Walk, London SE1 8XR
    map_url: https://www.google.com/maps/search/?api=1&query=BFI%20IMAX%2C%201%20Charlie%20Chaplin%20Walk%2C%20London%20SE1%208XR

# Weekday screenings count only if they start before or at/after these.
cinema_free_hours: { weekdayBefore: "09:00", weekdayFrom: "17:00" }

# Import order matters: the error workflow must exist before the others
# reference it. `id` matches the template's top-level id; `publish` makes the
# workflow's triggers live. n8n 2.x only calls a published error workflow.
n8n_workflows:
  - { name: ccfm-error, id: ccfmError0000001, publish: true }
  - { name: ccfm-sync, id: ccfmSync00000001, publish: true }
  - { name: ccfm-reminder, id: ccfmRemind000001, publish: true }

# n8n credential IDs (from /home/credentials/<id>), created by hand in the UI.
# Workflow import is skipped until both are set in group_vars.
n8n_google_calendar_credential_id: ""
n8n_gmail_credential_id: ""
