# Prowlarr owns config.xml and rewrites it when settings change in the UI, so
# only the settings in prowlarr_config_settings are managed here. Prowlarr creates the
# file on first start; the next run sets these.
---
- name: Check for Prowlarr config
  tags:
    - prowlarr
    - config
  stat:
    path: "{{ config_directory }}/prowlarr/config.xml"
  register: prowlarr_config

- name: Set config.xml settings
  tags:
    - prowlarr
    - config
  replace:
    path: "{{ config_directory }}/prowlarr/config.xml"
    regexp: '<{{ item.key }}>.*</{{ item.key }}>'
    replace: '<{{ item.key }}>{{ item.value }}</{{ item.key }}>'
  loop: "{{ prowlarr_config_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: prowlarr_config.stat.exists
  notify: Restart prowlarr
