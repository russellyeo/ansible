# A Tailscale subnet router advertising tailscale_router_routes. The route
# has to be approved once in the Tailscale admin console, and tailnet devices
# need "Use Tailscale subnets" (accept-routes) on.
# https://tailscale.com/kb/1282/docker
---
- name: Start container
  tags:
    - tailscale-router
    - container
  docker_container:
    name: tailscale-router
    image: tailscale/tailscale:latest
    state: "{{ docker_state }}"
    restart: "{{ docker_restart }}"
    restart_policy: "{{ docker_restart_policy }}"
    recreate: "{{ docker_recreate }}"
    volumes:
      - "{{ config_directory }}/tailscale-router/state:/var/lib/tailscale"
    networks:
      - name: "{{ tailscale_router_macvlan_network }}"
        ipv4_address: "{{ tailscale_router_ip }}"
    dns_servers:
      - "{{ dns_primary }}"
      - "{{ dns_secondary }}"
    env:
      TS_AUTHKEY: "{{ tailscale_authkey }}"
      TS_HOSTNAME: "{{ tailscale_router_hostname }}"
      TS_ROUTES: "{{ tailscale_router_routes | join(',') }}"
      TS_STATE_DIR: "/var/lib/tailscale"
      # Userspace networking routes subnets without /dev/net/tun.
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
    labels:
      traefik.enable: "false"
