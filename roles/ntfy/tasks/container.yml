# https://docs.ntfy.sh/install/#docker
---
- name: Start container
  tags:
    - ntfy
    - container
  docker_container:
    name: ntfy
    image: binwiederhier/ntfy:latest
    state: "{{ docker_state }}"
    # ntfy reads server.yml only at startup
    restart: "{{ 'yes' if ntfy_config is changed else docker_restart }}"
    restart_policy: "{{ docker_restart_policy }}"
    recreate: "{{ docker_recreate }}"
    command: serve
    user: "{{ servarr_uid }}:{{ servarr_gid }}"
    volumes:
      - "{{ config_directory }}/ntfy:/etc/ntfy"
      - "{{ config_directory }}/ntfy/cache:/var/cache/ntfy"
    networks:
      - name: "{{ docker_network }}"
    dns_servers:
      - "{{ dns_primary }}"
      - "{{ dns_secondary }}"
    ports:
      - "{{ host_port }}:8080"
    env:
      TZ: "{{ timezone }}"
    labels:
      traefik.enable: "true"
      traefik.http.routers.ntfy.rule: "Host(`ntfy.{{ home_domain }}`) || Host(`ntfy.{{ public_domain }}`)"
      traefik.http.routers.ntfy.entrypoints: "web,websecure"
      traefik.http.services.ntfy.loadbalancer.server.port: "8080"
      homepage.group: "Infrastructure"
      homepage.name: "Ntfy"
      homepage.icon: "ntfy.png"
      homepage.description: "Notifications"
      homepage.href: "https://ntfy.{{ public_domain }}"
