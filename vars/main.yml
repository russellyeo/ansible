# Timezone
timezone: "Europe/London"

# File permissions
directory_mode: "775"
file_mode: "664"

# DNS
dns_primary: "1.1.1.1"
dns_secondary: "1.0.0.1"

# Local domain. Resolved by AdGuard Home's wildcard rewrite *.{{ home_domain }}
# -> traefik_ip, which then routes by Host() to each container.
home_domain: "home.arpa"

# Public domain for HTTPS. Its DNS is hosted on Cloudflare: *.{{ public_domain }}
# points at traefik_ip ("DNS only"), and Traefik holds a wildcard
# certificate for it.
public_domain: "russellyeo.dev"

# Docker
docker_state: "started"
docker_restart: "no"
# "always", not "unless-stopped": DSM auto-updates `docker stop` every
# container before rebooting, which "unless-stopped" treats as a manual stop
# and leaves the whole stack down afterwards (2026-10-27).
docker_restart_policy: "always"
docker_recreate: "no"
docker_bridge_gateway: "172.18.0.1"

# Tailscale
tailnet_host: "{{ vault_tailnet_host }}"

# Cloudflare
# Zone DNS edit for public_domain only; Traefik uses it for the ACME DNS challenge.
cloudflare_dns_api_token: "{{ vault_cloudflare_dns_api_token }}"

# Vault
ansible_become_pass: "{{ vault_ansible_password }}"
openvpn_username: "{{ vault_openvpn_username }}"
openvpn_password: "{{ vault_openvpn_password }}"
github_username: "{{ vault_github_username }}"
github_personal_access_token: "{{ vault_github_personal_access_token }}"
docker_username: "{{ vault_docker_username }}"
docker_password: "{{ vault_docker_password }}"
watchtower_notification_slack_hook_url: "{{ vault_watchtower_notification_slack_hook_url }}"
sonarr_api_key: "{{ vault_sonarr_api_key }}"
radarr_api_key: "{{ vault_radarr_api_key }}"
seerr_api_key: "{{ vault_seerr_api_key }}"
plex_api_key: "{{ vault_plex_api_key }}"
jellyfin_api_key: "{{ vault_jellyfin_api_key }}"
tailscale_authkey: "{{ vault_tailscale_authkey }}"
ccfm_calendar_id: "{{ vault_ccfm_calendar_id }}"
ccfm_email_to: "{{ vault_ccfm_email_to }}"
cinema_calendar_id: "{{ vault_cinema_calendar_id }}"
cinema_email_to: "{{ vault_cinema_email_to }}"
tmdb_api_key: "{{ vault_tmdb_api_read_access_token }}"
omdb_api_key: "{{ vault_omdb_api_key }}"
