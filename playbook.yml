- name: Synology Media Server
  hosts: synology
  become: true
  vars_files:
    - vars/main.yml
    - vars/vault.yml
  roles:
    # Runs under `always` so a targeted run (--tags plex) still gets the
    # daemon check before its docker tasks.
    - role: docker-daemon
      tags:
        - always
    - docker-network
    - docker-socket-proxy
    - coredns
    - traefik
    - homepage
    - cloudflared
    - transmission
    - transmission-openvpn
    - plex
    - jellyfin
    - sonarr
    - radarr
    - prowlarr
    - bazarr
    - seerr
    - calibre-web-automated
    - flaresolverr
    - adguard-home
    - ntfy
    - uptime-kuma
    - beszel
    - n8n
    - changedetection
    - watchtower
